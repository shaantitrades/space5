name: Build and publish Docker image to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # ── Déploiement automatique (facultatif) ──────────────────────────────
      # Ajoutez ces deux secrets GitHub pour que l'image publiée soit déployée
      # sans aucune action manuelle :
      #   COOLIFY_WEBHOOK = https://<votre-coolify>/api/v1/deploy?uuid=<uuid-app>&force=false
      #   COOLIFY_TOKEN   = jeton API Coolify (Keys & Tokens → API tokens)
      # Sans eux, le workflow publie simplement l'image (aucun échec).
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/space5:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/space5:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # NEXT_PUBLIC_* sont inlinées au build (sinon http://localhost:3000)
          # Google AdSense : inliné au build — passer NEXT_PUBLIC_ADSENSE_ENABLED=true
          # et les IDs de blocs pour activer la monétisation (voir docs/ADSENSE.md).
          # Valeurs par défaut = annonces désactivées (aucune requête vers Google).
          build-args: |
            NEXT_PUBLIC_APP_URL=https://multi-convert.com
            NEXT_PUBLIC_API_URL=https://multi-convert.com
            NEXT_PUBLIC_VERSION=1.0.0
            NEXT_PUBLIC_ADSENSE_ENABLED=false
            NEXT_PUBLIC_ADSENSE_CLIENT=ca-pub-5343389597650456
            NEXT_PUBLIC_ADSENSE_CMP_ID=
            NEXT_PUBLIC_ADSENSE_SLOT_HEADER=
            NEXT_PUBLIC_ADSENSE_SLOT_IN_CONTENT=
            NEXT_PUBLIC_ADSENSE_SLOT_FOOTER=
            NEXT_PUBLIC_ADSENSE_REQUIRE_CONSENT=true

            NODE_MAX_OLD_SPACE_SIZE=4096
            # Workers du build : 4 = maximum de Next.js (les runners GitHub ont
            # la mémoire nécessaire). Voir next.config.js → buildWorkers().
            NEXT_BUILD_WORKERS=4

      - name: Output image
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/space5:latest"

      # ────────────────────────────────────────────────────────────────────────
      # Déclenche le déploiement Coolify UNE FOIS l'image publiée.
      # C'est ce qui évite les « 504 Gateway Timeout » : Coolify télécharge
      # l'image déjà construite au lieu de recompiler le projet sur le VPS
      # (2-4 Go de RAM, ce qui faisait tomber le site pendant le déploiement).
      # Se saute automatiquement si les secrets ne sont pas définis.
      # ────────────────────────────────────────────────────────────────────────
      - name: Trigger Coolify deployment
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          echo "Déclenchement du déploiement Coolify..."
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            || echo "⚠️ Webhook Coolify indisponible — déclenchez le déploiement depuis Coolify."
