name: Build and publish Docker image to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/space5:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/space5:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # NEXT_PUBLIC_* sont inlinées au build (sinon http://localhost:3000)
          build-args: |
            NEXT_PUBLIC_APP_URL=https://multi-convert.com
            NEXT_PUBLIC_API_URL=https://multi-convert.com
            NEXT_PUBLIC_VERSION=1.0.0
            NODE_MAX_OLD_SPACE_SIZE=4096

      - name: Output image
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/space5:latest"
