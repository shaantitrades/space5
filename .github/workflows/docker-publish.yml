name: Build and publish Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/space5:latest
            ghcr.io/${{ github.repository_owner }}/space5:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # NEXT_PUBLIC_* sont inlinées au build : sans ces valeurs, l'image
          # pointerait sur http://localhost:3000 (liens et métadonnées).
          # NEXT_PUBLIC_SITE_URL n'est pas nécessaire : le code retombe sur
          # l'URL canonique https://multi-convert.com.
          # NODE_MAX_OLD_SPACE_SIZE : les runners GitHub ont la RAM nécessaire
          # pour les 329 pages pré-rendues (le VPS, non).
          build-args: |
            NEXT_PUBLIC_APP_URL=https://multi-convert.com
            NEXT_PUBLIC_API_URL=https://multi-convert.com
            NEXT_PUBLIC_VERSION=1.0.0
            NODE_MAX_OLD_SPACE_SIZE=4096

      - name: Output image
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/space5:latest"
