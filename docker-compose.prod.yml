version: '3.8'

services:
  app:
    # ── Source de l'image ──────────────────────────────────────
    # Historique : il n'y avait d'abord que `image:` (sans `build:`) → Coolify
    # ne recompilait jamais le dépôt et relançait une image locale ancienne
    # (d'où /api/health figé au 7 septembre). D'où la présence de `build:`.
    #
    # MAIS compiler sur le VPS est ce qui provoquait les « 504 Gateway Timeout » :
    # le build Next.js demande 2-4 Go de RAM alors que l'ancien conteneur,
    # Postgres et Redis tournent déjà → OOM killer → le proxy n'a plus de
    # backend. La solution définitive est donc de NE PLUS compiler ici :
    #   IMAGE=<utilisateur Docker Hub>/space5:latest
    #   PULL_POLICY=always
    # L'image est construite par GitHub Actions (workflow
    # docker-publish-dockerhub.yml) sur les runners GitHub, puis simplement
    # téléchargée ici. Le VPS ne consomme plus 2-4 Go de RAM pour un build, il
    # ne peut donc plus se retrouver à court de mémoire pendant le
    # remplacement du conteneur (OOM → le proxy n'a plus de backend → 504).
    image: ${IMAGE:-multi-convert:latest}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-1.0.0}
    # Tag local par defaut : plus aucune dependance a une image GHCR.
    restart: unless-stopped
    # Temps laissé au process pour fermer ses connexions avant SIGKILL
    # (évite les requêtes coupées pendant un redéploiement).
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      # Plafond du tas Node.js : sans plafond, un pic mémoire du process faisait
      # tomber tout le VPS (OOM killer) et le site restait injoignable.
      # Surchargeable sans toucher au fichier : APP_MAX_OLD_SPACE=1024
      NODE_OPTIONS: --max-old-space-size=${APP_MAX_OLD_SPACE:-768}
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      # Resend (fournisseur principal) : une seule variable suffit.
      # Le domaine d'EMAIL_FROM doit être verifie dans le compte Resend.
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Emails applicatifs : sans EMAIL_FROM, le code retombe sur
      # "noreply@multi-convert.com", que le fournisseur refuse si l'adresse
      # n'est pas verifiee chez lui.
      EMAIL_FROM: ${EMAIL_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      LEADS_NOTIFICATION_EMAIL: ${LEADS_NOTIFICATION_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      # `service_started` (et non `service_healthy`) : l'application démarre et
      # répond immédiatement, même si Postgres/Redis finissent de démarrer.
      # Le schéma est appliqué en arrière-plan par docker-entrypoint.sh et le
      # code est tolérant à une base momentanément indisponible : mieux vaut un
      # site qui répond que des minutes de « 504 Gateway Timeout ».
      mc_postgres:
        condition: service_started
      mc_redis:
        condition: service_started
    # Expose container port so Coolify (or other orchestrators) can detect the app port
    expose:
      - "3000"
    # Plafonds de ressources : un conteneur ne doit jamais pouvoir affamer
    # l'hôte (c'était la cause du site injoignable après un déploiement).
    # Ajustables dans Coolify sans modifier ce fichier.
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    memswap_limit: ${APP_MEM_LIMIT:-1536m}
    healthcheck:
      # Sonde de VIVACITÉ : /api/health ne touche PAS la base de données, la
      # sonde ne peut donc pas échouer à cause d'une base lente.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    # Rotation des logs : un disque plein rendait le site injoignable (et le
    # redémarrage impossible) sur les VPS à petit disque.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - proxy

  # Nom de service unique (évite les collisions DNS avec d'autres stacks sur le réseau partagé "coolify")
  mc_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MultiConvert2026}
      POSTGRES_DB: ${POSTGRES_DB:-multi_convert}
    volumes:
      - pgdata_v5:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-multi_convert}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${PG_MEM_LIMIT:-768m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  mc_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEM_LIMIT:-384m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  pgdata_v5:
  redis_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: coolify
