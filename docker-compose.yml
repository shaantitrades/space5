# ============================================================
# docker-compose.coolify.yml — Configuration Coolify / VPS
# ============================================================
# Usage:
#   Pointer Coolify vers ce fichier dans "Docker Compose > Compose File"
#   ou le renommer en docker-compose.yml
#
# Variables d'environnement : définies dans l'interface Coolify
# (section "Environment Variables" du service)
# ============================================================

version: '3.8'

services:
  # ──── Application Next.js ────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-1.0.0}
    image: multi-convert:latest
    ports:
      - "18080:3000"
    restart: unless-stopped
    # Pas de binding de port hôte : le proxy Coolify route vers le conteneur (évite "port already allocated")
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_URL: postgresql://postgres:MultiConvert2026@postgres:5432/multi_convert
      DIRECT_URL: postgresql://postgres:MultiConvert2026@postgres:5432/multi_convert
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-1.0.0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - internal
      - proxy

  # ──── PostgreSQL ────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MultiConvert2026
      POSTGRES_DB: multi_convert
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_convert"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ──── Redis ────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata_v3:
  redis_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: coolify
