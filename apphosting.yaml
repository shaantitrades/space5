# Firebase App Hosting configuration for Next.js
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  # ========== MODE & ENVIRONNEMENT ==========
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
      - BUILD

  - variable: DEV_MODE
    value: "false"
    availability:
      - RUNTIME
      - BUILD

  - variable: SKIP_DB
    value: "false"
    availability:
      - RUNTIME
      - BUILD

  # ========== SUPABASE DATABASE ==========
  # ⚠️ Configurer dans Firebase Console > Secrets
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
      - BUILD

  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability:
      - BUILD

  # ========== SUPABASE PUBLIC ==========
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: "https://poilochddyciosejieyy.supabase.co"
    availability:
      - RUNTIME
      - BUILD

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: "sb_publishable_rgBxmtPL9rU2iNk6EaggrA_VvmJ8XXf"
    availability:
      - RUNTIME
      - BUILD

  # Service role (secret)
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # ========== REDIS ==========
  - variable: REDIS_URL
    secret: REDIS_URL
    availability:
      - RUNTIME

  # ========== APP URL ==========
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://space5-XXXXXX.web.app"
    availability:
      - RUNTIME
      - BUILD

  # ========== STRIPE ==========
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - RUNTIME
      - BUILD

  # ========== UPLOADTHING ==========
  - variable: UPLOADTHING_SECRET
    secret: UPLOADTHING_SECRET
    availability:
      - RUNTIME

  - variable: UPLOADTHING_APP_ID
    secret: UPLOADTHING_APP_ID
    availability:
      - RUNTIME
      - BUILD

  # ========== SECURITY KEYS ==========
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME

  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - RUNTIME

  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability:
      - RUNTIME

  # ========== GOOGLE OAUTH ==========
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
    availability:
      - RUNTIME

  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
    availability:
      - RUNTIME

buildConfig:
  runtime: nodejs22
  environmentVariables:
    NODE_OPTIONS: "--max-old-space-size=4096"
