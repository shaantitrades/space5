# Firebase App Hosting configuration for Next.js
runConfig:
  # Run-time CPU and memory allocation
  cpu: 1
  memoryMiB: 512
  # Minimum and maximum instances
  minInstances: 0
  maxInstances: 4
  # Concurrency (requests per instance)
  concurrency: 80

env:
  # ========== MODE & ENVIRONNEMENT ==========
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
      - BUILD
  
  - variable: DEV_MODE
    value: "false"
    availability:
      - RUNTIME
      - BUILD
  
  - variable: SKIP_DB
    value: "false"
    availability:
      - RUNTIME
      - BUILD
  
  # ========== SUPABASE DATABASE ==========
  # ⚠️ À CONFIGURER DANS FIREBASE CONSOLE > SECRETS
  # Ces variables contiennent vos identifiants de base de données
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
      - BUILD
  
  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability:
      - BUILD
  
  # ========== SUPABASE PUBLIC (Safe - URLs publiques) ==========
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: "https://poilochddyciosejieyy.supabase.co"
    availability:
      - RUNTIME
      - BUILD
  
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: "sb_publishable_rgBxmtPL9rU2iNk6EaggrA_VvmJ8XXf"
    availability:
      - RUNTIME
      - BUILD
  
  # ⚠️ SUPABASE SERVICE ROLE - À CONFIGURER EN SECRET
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME
  
  # ========== REDIS ==========
  # ⚠️ À CONFIGURER EN SECRET (remplacer par votre URL Redis Cloud/Upstash)
  - variable: REDIS_URL
    secret: REDIS_URL
    availability:
      - RUNTIME
  
  # ========== APP URL ==========
  # Modifier après le premier déploiement avec votre vraie URL Firebase
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://space5-XXXXXX.web.app"
    availability:
      - RUNTIME
      - BUILD
  
  # ========== STRIPE PAYMENTS ==========
  # ⚠️ À CONFIGURER EN SECRET - Clés de production Stripe
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - RUNTIME
      - BUILD
  
  # ========== UPLOADTHING ==========
  # ⚠️ À CONFIGURER EN SECRET
  - variable: UPLOADTHING_SECRET
    secret: UPLOADTHING_SECRET
    availability:
      - RUNTIME
  
  - variable: UPLOADTHING_APP_ID
    secret: UPLOADTHING_APP_ID
    availability:
      - RUNTIME
      - BUILD
  
  # ========== SECURITY KEYS ==========
  # ⚠️ IMPORTANT : GÉNÉRER DES CLÉS SÉCURISÉES EN PRODUCTION !
  # Utilisez : openssl rand -base64 32
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  
  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - RUNTIME
  
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability:
      - RUNTIME
  
  # ========== GOOGLE OAUTH (si utilisé) ==========
  # ⚠️ À CONFIGURER EN SECRET
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
    availability:
      - RUNTIME
  
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
    availability:
      - RUNTIME
  
  # ========== AWS S3 (si utilisé pour stockage) ==========
  # ⚠️ À CONFIGURER EN SECRET
  # - variable: AWS_ACCESS_KEY_ID
  #   secret: AWS_ACCESS_KEY_ID
  #   availability:
  #     - RUNTIME
  # 
  # - variable: AWS_SECRET_ACCESS_KEY
  #   secret: AWS_SECRET_ACCESS_KEY
  #   availability:
  #     - RUNTIME
  # 
  # - variable: AWS_REGION
  #   value: "us-east-1"
  #   availability:
  #     - RUNTIME
  # 
  # - variable: AWS_S3_BUCKET
  #   secret: AWS_S3_BUCKET
  #   availability:
  #     - RUNTIME
  
  # ========== EMAIL SMTP (si utilisé) ==========
  # ⚠️ À CONFIGURER EN SECRET
  # - variable: SMTP_HOST
  #   secret: SMTP_HOST
  #   availability:
  #     - RUNTIME
  # 
  # - variable: SMTP_PORT
  #   value: "587"
  #   availability:
  #     - RUNTIME
  # 
  # - variable: SMTP_USER
  #   secret: SMTP_USER
  #   availability:
  #     - RUNTIME
  # 
  # - variable: SMTP_PASSWORD
  #   secret: SMTP_PASSWORD
  #   availability:
  #     - RUNTIME

# Configuration du build
buildConfig:
  runtime: nodejs22
  environmentVariables:
    NODE_OPTIONS: "--max-old-space-size=4096"
